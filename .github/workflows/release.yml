name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as fh:
              print(tomllib.load(fh)['project']['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q '^atv_homekit_remote-'; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "replaced=false" >> "$GITHUB_OUTPUT"
            else
              gh release delete "$TAG" --cleanup-tag --yes
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "replaced=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "replaced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distribution
        if: steps.existing.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Create release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPLACED: ${{ steps.existing.outputs.replaced }}
        shell: bash
        run: |
          if [ "$REPLACED" = "true" ]; then
            gh release create "$TAG" dist/* \
              --target "$SHA" \
              --title "$TAG" \
              --notes "Initial release of atv-homekit-remote."
          else
            gh release create "$TAG" dist/* \
              --target "$SHA" \
              --title "$TAG" \
              --generate-notes
          fi
