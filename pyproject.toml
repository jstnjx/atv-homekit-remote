[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "atv-homekit-remote"
version = "0.1.0"
description = "Pure-Python HomeKit Target Controller and Siri voice streaming library for Apple TV"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Justin Jäger"}]
keywords = ["apple-tv", "homekit", "siri", "hds", "remote", "home-automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = [
  # The library subclasses a small number of HAP-python 5.0 internals to retain
  # Pair Verify connection context needed by HomeKit Data Stream. Keep this on
  # the audited minor series until those integration points are revalidated.
  "HAP-python>=5.0.0,<5.1",
  "cryptography>=45,<51",
  "opuslib-next-bundled>=0.1.1,<0.2",
  "aiohttp>=3.10,<4",
]

[project.urls]
Repository = "https://github.com/jstnjx/atv-homekit-remote"
Issues = "https://github.com/jstnjx/atv-homekit-remote/issues"
Upstream = "https://github.com/marcusadolfsson/appletv-siri-voice"

[project.scripts]
atv-siri = "atv_siri.cli:main"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]
dev = [
  "atv-homekit-remote[test]",
  "build>=1.2,<2",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atv_siri"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
