[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "atv-siri-py"
version = "0.1.0"
description = "Pure-Python HomeKit Target Controller and Siri voice streaming library for Apple TV"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Justin Jäger"}]
keywords = ["apple-tv", "homekit", "siri", "hds", "remote"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = [
  "HAP-python>=5.0.0,<6",
  "cryptography>=45",
  "opuslib-next-bundled>=0.1.1",
  "aiohttp>=3.10",
]

[project.scripts]
atv-siri = "atv_siri.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
dev = ["atv-siri-py[test]", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/atv_siri"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
